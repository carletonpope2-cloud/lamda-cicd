AWSTemplateFormatVersion: '2010-09-09'
Description: "S3 bucket with environment tags."

Parameters:
  BucketName:
    Type: String
    Default: "test"
    AllowedValues:
    - "test"
    - "production"
    - "staging"
      
Resources:
  MyS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-${Environment}-bucket'
      Tags:
        - Key: Environment
          Value: Environment
        - Key: Project
          Value: GitHubPRTest2

Outputs:
  S3BucketName:
    Description: "The name of the S3 bucket."
    Value: !Ref MyS3Bucket