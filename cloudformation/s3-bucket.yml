AWSTemplateFormatVersion: '2010-09-09'
Description: "S3 bucket for CICD Pull Requests."

Parameters:
  BucketName:
    Type: String
    Default: "test"
    AllowedValues:
      - "test"
      - "production"
      - "staging"
      
Resources:
  MyS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-${Environment}-bucket'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Environment
          Value: !Ref GitHubActionsTesting

Outputs:
  S3BucketName:
    Value: !Ref MyS3Bucket
    Description: "The name of the S3 bucket."